name: Build Nginx with Post-Quantum OpenSSL

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            wget \
            curl \
            perl \
            libpcre3-dev \
            zlib1g-dev \
            ca-certificates

      - name: Get latest Nginx version
        id: nginx-latest
        run: |
          NGINX_VERSION=$(curl -s https://nginx.org/en/download.html | grep -oP 'nginx-\K[\d.]+(?=\.tar\.gz)' | head -1)
          echo "version=$NGINX_VERSION" >> $GITHUB_OUTPUT
          echo "Selected Nginx version: $NGINX_VERSION"

      - name: Download and build OpenSSL 3.2 (with PQC support)
        run: |
          cd /tmp
          wget https://github.com/openssl/openssl/releases/download/openssl-3.2.0/openssl-3.2.0.tar.gz
          tar -xzf openssl-3.2.0.tar.gz
          cd openssl-3.2.0
          
          ./config \
            --prefix=/usr/local/openssl-pqc \
            --openssldir=/usr/local/openssl-pqc \
            --libdir=lib \
            enable-tls1_3 \
            no-shared \
            no-comp \
            no-deprecated \
            no-ssl3 \
            no-ssl3-method
          
          make -j$(nproc)
          sudo make install_sw

      - name: Download Nginx source
        run: |
          NGINX_VERSION=${{ steps.nginx-latest.outputs.version }}
          wget https://nginx.org/download/nginx-$NGINX_VERSION.tar.gz
          tar -xzf nginx-$NGINX_VERSION.tar.gz

      - name: Configure and build Nginx
        run: |
          NGINX_VERSION=${{ steps.nginx-latest.outputs.version }}
          cd nginx-$NGINX_VERSION
          
          ./configure \
            --prefix=/usr/local/nginx-pqc \
            --with-http_ssl_module \
            --with-http_v2_module \
            --with-http_realip_module \
            --with-http_stub_status_module \
            --with-stream \
            --with-stream_ssl_module \
            --with-cc-opt="-I/usr/local/openssl-pqc/include -Wno-error=implicit-function-declaration" \
            --with-ld-opt="-L/usr/local/openssl-pqc/lib -Wl,-rpath,/usr/local/openssl-pqc/lib"
          
          # 移除 -Werror 避免编译错误
          sed -i 's/-Werror//g' auto/cc/gcc
          
          make -j$(nproc)

      - name: Test Nginx binary
        run: |
          cd nginx-${{ steps.nginx-latest.outputs.version }}
          ./objs/nginx -v

      - name: Package binary
        run: |
          NGINX_VERSION=${{ steps.nginx-latest.outputs.version }}
          
          mkdir -p nginx-pqc/usr/local/nginx-pqc
          cp nginx-$NGINX_VERSION/objs/nginx nginx-pqc/usr/local/nginx-pqc/
          cp -r nginx-$NGINX_VERSION/conf nginx-pqc/usr/local/nginx-pqc/
          
          echo '#!/bin/bash' > nginx-pqc/start-nginx.sh
          echo 'export LD_LIBRARY_PATH=/usr/local/openssl-pqc/lib:$LD_LIBRARY_PATH' >> nginx-pqc/start-nginx.sh
          echo 'exec /usr/local/nginx-pqc/nginx -c /usr/local/nginx-pqc/conf/nginx.conf "$@"' >> nginx-pqc/start-nginx.sh
          
          chmod +x nginx-pqc/start-nginx.sh
          tar -czf nginx-pqc-linux-amd64.tar.gz nginx-pqc/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nginx-pqc-linux-amd64
          path: nginx-pqc-linux-amd64.tar.gz
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: nginx-pqc-${{ steps.nginx-latest.outputs.version }}
          name: Nginx PQC Build ${{ steps.nginx-latest.outputs.version }}
          body: |
            Nginx with OpenSSL 3.2 (Post-Quantum support)
            - AMD64 only
            - TLS 1.3
          files: nginx-pqc-linux-amd64.tar.gz
          draft: false
          prerelease: true
name: Build Nginx with Post-Quantum OpenSSL

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        arch: [ amd64, arm64 ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            wget \
            curl \
            perl \
            libpcre3-dev \
            zlib1g-dev \
            libssl-dev \
            ca-certificates

      - name: Get latest Nginx version
        id: nginx-latest
        run: |
          NGINX_VERSION=$(curl -s https://nginx.org/en/download.html | grep -oP 'nginx-\K[\d.]+(?=\.tar\.gz)' | head -1)
          echo "version=$NGINX_VERSION" >> $GITHUB_OUTPUT
          echo "Selected Nginx version: $NGINX_VERSION"

      - name: Get latest OpenSSL version
        id: openssl-latest
        run: |
          cd /tmp
          git clone --depth 1 https://github.com/openssl/openssl.git openssl-src
          cd openssl-src
          OPENSSL_VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "3.3.0")
          echo "version=$OPENSSL_VERSION" >> $GITHUB_OUTPUT
          echo "OpenSSL version: $OPENSSL_VERSION"
          cd ..
          mv openssl-src openssl-$OPENSSL_VERSION

      - name: Download Nginx source
        run: |
          NGINX_VERSION=${{ steps.nginx-latest.outputs.version }}
          wget https://nginx.org/download/nginx-$NGINX_VERSION.tar.gz
          tar -xzf nginx-$NGINX_VERSION.tar.gz
          echo "Nginx source prepared: nginx-$NGINX_VERSION"

      - name: Configure and build OpenSSL
        run: |
          OPENSSL_VERSION=${{ steps.openssl-latest.outputs.version }}
          cd /tmp/openssl-$OPENSSL_VERSION
          
          ./config \
            --prefix=/usr/local/openssl-pqc \
            --openssldir=/usr/local/openssl-pqc \
            enable-tls1_3 \
            enable-ec_nistp_64_gcc_128 \
            enable-rfc3779 \
            enable-cms \
            enable-ct \
            no-shared \
            no-comp \
            no-deprecated \
            no-ssl3 \
            no-ssl3-method
          
          make -j$(nproc)
          sudo make install_sw

      - name: Configure and build Nginx
        run: |
          NGINX_VERSION=${{ steps.nginx-latest.outputs.version }}
          cd nginx-$NGINX_VERSION
          
          ./configure \
            --prefix=/usr/local/nginx-pqc \
            --with-http_ssl_module \
            --with-http_v2_module \
            --with-http_realip_module \
            --with-http_addition_module \
            --with-http_sub_module \
            --with-http_dav_module \
            --with-http_flv_module \
            --with-http_mp4_module \
            --with-http_gunzip_module \
            --with-http_gzip_static_module \
            --with-http_auth_request_module \
            --with-http_random_index_module \
            --with-http_secure_link_module \
            --with-http_degradation_module \
            --with-http_slice_module \
            --with-http_stub_status_module \
            --with-mail \
            --with-mail_ssl_module \
            --with-stream \
            --with-stream_ssl_module \
            --with-stream_ssl_preread_module \
            --with-threads \
            --with-file-aio \
            --with-cc-opt="-I/usr/local/openssl-pqc/include" \
            --with-ld-opt="-L/usr/local/openssl-pqc/lib64 -L/usr/local/openssl-pqc/lib -Wl,-rpath,/usr/local/openssl-pqc/lib64:/usr/local/openssl-pqc/lib"
          
          make -j$(nproc)

      - name: Test Nginx binary
        run: |
          cd nginx-${{ steps.nginx-latest.outputs.version }}
          ./objs/nginx -v
          ./objs/nginx -t 2>&1 || true
          ldd ./objs/nginx | grep openssl || echo "Checking OpenSSL linkage..."

      - name: Package binary and dependencies
        run: |
          NGINX_VERSION=${{ steps.nginx-latest.outputs.version }}
          ARCH=${{ matrix.arch }}
          
          mkdir -p nginx-pqc-$ARCH/usr/local/nginx-pqc
          mkdir -p nginx-pqc-$ARCH/usr/local/openssl-pqc/lib
          
          cp nginx-$NGINX_VERSION/objs/nginx nginx-pqc-$ARCH/usr/local/nginx-pqc/
          cp -r nginx-$NGINX_VERSION/conf nginx-pqc-$ARCH/usr/local/nginx-pqc/
          
          if [ -d /usr/local/openssl-pqc/lib64 ]; then
            cp -r /usr/local/openssl-pqc/lib64/* nginx-pqc-$ARCH/usr/local/openssl-pqc/lib/ 2>/dev/null || true
          fi
          if [ -d /usr/local/openssl-pqc/lib ]; then
            cp -r /usr/local/openssl-pqc/lib/* nginx-pqc-$ARCH/usr/local/openssl-pqc/lib/ 2>/dev/null || true
          fi
          
          echo '#!/bin/bash' > nginx-pqc-$ARCH/start-nginx.sh
          echo '# Set custom OpenSSL library path' >> nginx-pqc-$ARCH/start-nginx.sh
          echo 'export LD_LIBRARY_PATH=/usr/local/openssl-pqc/lib:$LD_LIBRARY_PATH' >> nginx-pqc-$ARCH/start-nginx.sh
          echo 'exec /usr/local/nginx-pqc/nginx -c /usr/local/nginx-pqc/conf/nginx.conf "$@"' >> nginx-pqc-$ARCH/start-nginx.sh
          
          chmod +x nginx-pqc-$ARCH/start-nginx.sh
          
          tar -czf nginx-pqc-linux-$ARCH.tar.gz nginx-pqc-$ARCH/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nginx-pqc-linux-${{ matrix.arch }}
          path: nginx-pqc-linux-${{ matrix.arch }}.tar.gz
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' && matrix.arch == 'amd64'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: nginx-pqc-${{ steps.nginx-latest.outputs.version }}-openssl-${{ steps.openssl-latest.outputs.version }}
          name: Nginx PQC Build ${{ steps.nginx-latest.outputs.version }}
          body: |
            ## Nginx with Post-Quantum OpenSSL Support
            
            **Features:**
            - Nginx ${{ steps.nginx-latest.outputs.version }}
            - OpenSSL ${{ steps.openssl-latest.outputs.version }}
            - TLS 1.3 support
            - Static OpenSSL linking
            
            **Post-Quantum Support:**
            OpenSSL 3.0+ providers enable PQC algorithms (Kyber, Dilithium, etc.)
            
            **Usage:**
            1. tar -xzf nginx-pqc-linux-${{ matrix.arch }}.tar.gz
            2. cd nginx-pqc-${{ matrix.arch }}
            3. Edit conf/nginx.conf
            4. ./start-nginx.sh
          files: nginx-pqc-linux-${{ matrix.arch }}.tar.gz
          draft: false
          prerelease: true
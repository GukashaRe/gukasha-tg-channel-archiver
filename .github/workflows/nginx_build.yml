name: Build Nginx with Post-Quantum OpenSSL

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            wget \
            curl \
            perl \
            libpcre3-dev \
            zlib1g-dev \
            ca-certificates

      - name: Get latest Nginx version
        id: nginx-latest
        run: |
          NGINX_VERSION=$(curl -s https://nginx.org/en/download.html | grep -oP 'nginx-\K[\d.]+(?=\.tar\.gz)' | head -1)
          echo "version=$NGINX_VERSION" >> $GITHUB_OUTPUT
          echo "Selected Nginx version: $NGINX_VERSION"

      - name: Download and build latest OpenSSL from GitHub
        id: openssl-build
        run: |
          cd /tmp
          
          OPENSSL_URL=$(curl -s https://api.github.com/repos/openssl/openssl/releases/latest | grep -oP '"tarball_url":\s*"\K[^"]+')
          
          if [ -z "$OPENSSL_URL" ]; then
            OPENSSL_URL="https://github.com/openssl/openssl/archive/master.tar.gz"
          fi
          
          wget "$OPENSSL_URL" -O openssl-latest.tar.gz
          tar -xzf openssl-latest.tar.gz
          OPENSSL_DIR=$(find . -maxdepth 1 -type d -name "openssl-*" | head -1 | sed 's/^\.\///')
          
          cd "$OPENSSL_DIR"
          
          OPENSSL_VERSION=$(./Configure --version 2>&1 | head -1 | awk '{print $2}')
          echo "version=$OPENSSL_VERSION" >> $GITHUB_OUTPUT
          echo "OPENSSL_VERSION=$OPENSSL_VERSION" >> $GITHUB_ENV
          
          echo "Building OpenSSL version: $OPENSSL_VERSION"
          
          ./config \
            --prefix=/usr/local/openssl-pqc \
            --openssldir=/usr/local/openssl-pqc \
            --libdir=lib \
            enable-tls1_3 \
            no-shared \
            no-comp \
            no-deprecated \
            no-ssl3 \
            no-ssl3-method
          
          make -j$(nproc)
          sudo make install_sw

      - name: Download Nginx source
        run: |
          NGINX_VERSION=${{ steps.nginx-latest.outputs.version }}
          wget https://nginx.org/download/nginx-$NGINX_VERSION.tar.gz
          tar -xzf nginx-$NGINX_VERSION.tar.gz

      - name: Configure and build Nginx
        run: |
          NGINX_VERSION=${{ steps.nginx-latest.outputs.version }}
          cd nginx-$NGINX_VERSION
          
          ./configure \
            --prefix=/usr/local/nginx \
            --with-http_ssl_module \
            --with-http_v2_module \
            --with-http_realip_module \
            --with-http_stub_status_module \
            --with-stream \
            --with-stream_ssl_module \
            --with-cc-opt="-I/usr/local/openssl-pqc/include -Wno-error=implicit-function-declaration" \
            --with-ld-opt="-L/usr/local/openssl-pqc/lib -Wl,-rpath,/usr/local/openssl-pqc/lib"
          
          sed -i 's/-Werror//g' auto/cc/gcc
          make -j$(nproc)

      - name: Test Nginx binary
        run: |
          cd nginx-${{ steps.nginx-latest.outputs.version }}
          ./objs/nginx -v
          ./objs/nginx -V 2>&1 | grep "built with OpenSSL"

      - name: Extract OpenSSL version from nginx binary
        id: extract-openssl
        run: |
          cd nginx-${{ steps.nginx-latest.outputs.version }}
          OPENSSL_VER=$(./objs/nginx -V 2>&1 | grep -oP 'built with OpenSSL \K[0-9]+\.[0-9]+\.[0-9]+')
          echo "version=$OPENSSL_VER" >> $GITHUB_OUTPUT
          echo "Extracted OpenSSL version: $OPENSSL_VER"

      - name: Package binary
        run: |
          NGINX_VERSION=${{ steps.nginx-latest.outputs.version }}
          OPENSSL_VERSION=${{ steps.extract-openssl.outputs.version }}
          
          mkdir -p nginx-pqc/usr/local/nginx
          cp nginx-$NGINX_VERSION/objs/nginx nginx-pqc/usr/local/nginx/
          cp -r nginx-$NGINX_VERSION/conf nginx-pqc/usr/local/nginx/
          
          mkdir -p nginx-pqc/usr/local/nginx/logs
          mkdir -p nginx-pqc/usr/local/nginx/client_body_temp
          mkdir -p nginx-pqc/usr/local/nginx/proxy_temp
          mkdir -p nginx-pqc/usr/local/nginx/fastcgi_temp
          mkdir -p nginx-pqc/usr/local/nginx/uwsgi_temp
          mkdir -p nginx-pqc/usr/local/nginx/scgi_temp
          
          cat > nginx-pqc/start-nginx.sh << 'EOF'
          #!/bin/bash
          NGINX_HOME="/usr/local/nginx"
          export LD_LIBRARY_PATH=/usr/local/openssl-pqc/lib:$LD_LIBRARY_PATH
          
          for dir in logs client_body_temp proxy_temp fastcgi_temp uwsgi_temp scgi_temp; do
              [ -d "$NGINX_HOME/$dir" ] || mkdir -p "$NGINX_HOME/$dir"
          done
          
          exec $NGINX_HOME/nginx -c $NGINX_HOME/conf/nginx.conf "$@"
          EOF
          
          chmod +x nginx-pqc/start-nginx.sh
          
          cat > nginx-pqc/VERSION << EOF
          Nginx: $NGINX_VERSION
          OpenSSL: ${OPENSSL_VERSION:-latest}
          Build Date: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          EOF
          
          tar -czf nginx-pqc-linux-amd64.tar.gz nginx-pqc/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nginx-pqc-linux-amd64
          path: nginx-pqc-linux-amd64.tar.gz
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: nginx-${{ steps.nginx-latest.outputs.version }}-openssl-${{ steps.extract-openssl.outputs.version }}
          name: "Nginx ${{ steps.nginx-latest.outputs.version }} + OpenSSL ${{ steps.extract-openssl.outputs.version }}"
          body: |
            Nginx with Latest OpenSSL (Post-Quantum Support)
            
            Components:
            - Nginx: ${{ steps.nginx-latest.outputs.version }}
            - OpenSSL: ${{ steps.extract-openssl.outputs.version }}
            - Platform: Linux AMD64
            - TLS 1.3 with PQC support
            
            Installation:
            tar -xzf nginx-pqc-linux-amd64.tar.gz
            cd nginx-pqc
            ./start-nginx.sh
          files: nginx-pqc-linux-amd64.tar.gz
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}